<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>myTierAnime</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/cards-and-tiers.css">
  <link rel="stylesheet" href="css/modals-and-panels.css">
  <style>
    body { margin: 0; background: #06050c; color: #f5f3ff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .topbar { position: sticky; top: 0; z-index: 500; background: rgba(13, 10, 28, 0.94); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.14); padding: 12px 22px; }
    .topbar-inner { max-width: 1780px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand-orb { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ffd76a, #ff3c8c, #00f5ff); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; color: #090614; }
    .brand-text h1 { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900; margin: 0; color: #ffe8a3; }
    .toolbar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.07); color: #f5f3ff; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #ffd76a, #ff9f43); color: #0b0818; border-color: transparent; }
    .stats-ribbon { max-width: 1780px; margin: 18px auto 6px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .stat-card { background: rgba(18, 15, 36, 0.9); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; }
    .stat-label { font-size: 10.5px; color: #a6a0c4; text-transform: uppercase; }
    .stat-val { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 800; color: #fff; margin-top: 3px; }
    .stat-sub { font-size: 11.5px; color: #a6a0c4; margin-top: 3px; font-weight: 600; }
    .tiers-container { max-width: 1780px; margin: 0 auto; padding: 10px 20px 80px; display: flex; flex-direction: column; gap: 24px; }
    .tier { position: relative; display: grid; grid-template-columns: 185px 1fr; background: rgba(16, 13, 30, 0.9); border: 1px solid rgba(255,255,255,0.14); border-radius: 22px; overflow: hidden; margin-bottom: 20px; }
    .tier-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 10px; background: rgba(8, 6, 16, 0.72); border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .seal-index { font-size: 9.5px; letter-spacing: 0.16em; color: #a6a0c4; text-transform: uppercase; }
    .seal-index b { color: #ffd76a; font-weight: 800; }
    .seal-caption { font-size: 11px; font-weight: 700; color: #f5f3ff; }
    .tier-content { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .tier-header-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.09); }
    .tier-title-group h2 { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700; color: #f5f3ff; margin: 0; display: flex; align-items: center; gap: 10px; }
    .tier-count-pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid #ffd76a; color: #ffd76a; }
    .tier-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 11px; align-items: start; }
    .card-unit { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
    .card { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: #120f24; border: 1px solid rgba(255,255,255,0.14); }
    .card-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .rank { position: absolute; top: 6px; left: 6px; z-index: 4; width: 19px; height: 19px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; color: #090614; background: #ffd76a; }
    .card-score-badge { position: absolute; top: 6px; right: 6px; z-index: 4; padding: 1.5px 5px; border-radius: 5px; font-size: 9px; font-weight: 800; color: #ffd76a; background: rgba(10,8,20,0.88); border: 1px solid rgba(255,215,106,0.45); }
    .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 7px 7px 6px; z-index: 4; background: linear-gradient(to top, rgba(6,5,14,0.95) 0%, rgba(6,5,14,0.5) 40%, transparent 72%); }
    .card-title { font-size: 11px; font-weight: 700; color: #fff; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 9px; color: #a6a0c4; }
    .card-under-meta { background: rgba(14,12,28,0.92); border: 1px solid rgba(255,255,255,0.11); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; font-size: 10px; }
    .cum-row { display: flex; align-items: center; justify-content: space-between; }
    .cum-kind { font-size: 8.5px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: #00f5ff; border: 1px solid rgba(0,245,255,0.45); }
    .cum-episodes-line { font-size: 10px; font-weight: 700; color: #f5f3ff; }
    .cum-hours-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(0,245,255,0.08); border-radius: 6px; padding: 3px 7px; color: #b8fbff; }
    .cum-hours-bar b { color: #00f5ff; }
    .recent-showcase-wrap { max-width: 1780px; margin: 12px auto 6px; padding: 0 20px; }
    .recent-showcase-box { background: rgba(20,16,40,0.9); border: 1px solid rgba(0,245,255,0.28); border-radius: 20px; padding: 14px 18px 16px; }
    .recent-showcase-head { padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.09); }
    .recent-showcase-title { margin: 0; font-family: 'Cinzel', serif; font-size: 15.5px; font-weight: 800; color: #fff; }
    .recent-showcase-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 11px; }
    .recent-poster-frame { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: #120f24; border: 1px solid rgba(255,255,255,0.16); }
    .recent-tier-badge { position: absolute; top: 6px; left: 6px; z-index: 4; padding: 2px 6px; border-radius: 5px; font-size: 9px; font-weight: 900; color: #090614; background: #ffd76a; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" onclick="location.reload()">
          <div class="brand-orb">S</div>
          <div class="brand-text"><h1>myTierAnime</h1></div>
        </div>
        <div class="toolbar-controls">
          <button type="button" class="btn btn-primary" onclick="location.reload()">🔄 Обновить страницу</button>
        </div>
      </div>
    </header>

    <section id="statsRibbon" class="stats-ribbon"></section>
    <section id="recentSection" class="recent-showcase-wrap"></section>
    <main id="tiersRoot" class="tiers-container"></main>
  </div>

  <script>
    (async function initStandaloneApp() {
      let data = null;
      try {
        const res = await fetch("data/tiers.json?nocache=" + Date.now());
        if (res.ok) data = await res.json();
      } catch {}

      if (!data || !Array.isArray(data.tiers)) {
        data = {
          tiers: [
            { id: "S", name: "Шедевры", subtitle: "Лучшие и незабываемые тайтлы", items: [] },
            { id: "A", name: "Отличные", subtitle: "Яркие и качественные работы", items: [] },
            { id: "B", name: "Хорошие", subtitle: "Достойные внимания", items: [] },
            { id: "C", name: "Нормальные", subtitle: "Средние тайтлы", items: [] },
            { id: "D", name: "Слабые", subtitle: "Проходные проекты", items: [] },
            { id: "E", name: "Плохие", subtitle: "Разочарования", items: [] }
          ]
        };
      }

      let totalTitles = 0, sumEp = 0, sumMv = 0, sumHr = 0, scoreSum = 0;
      const recentList = [];

      data.tiers.forEach(t => {
        (t.items || []).forEach(it => {
          totalTitles++;
          scoreSum += parseFloat(it.score || 0);
          let eps = 0, mvs = 0, hrs = 0;
          const seasons = Array.isArray(it.seasons) ? it.seasons : [{ episodes: it.episodes || 12, epMinutes: 24, type: it.kind || "TV Сериал", date: "2026" }];
          seasons.forEach(s => {
            const e = parseInt(s.episodes, 10) || 0;
            const mn = parseFloat(s.epMinutes) || (s.type === "Фильм" ? 110 : 24);
            if (e > 0) {
              hrs += (e * mn) / 60;
              if (s.type === "Фильм") mvs += e; else eps += e;
            }
          });
          sumEp += eps; sumMv += mvs; sumHr += hrs;
          recentList.push({ item: it, tier: t, kind: it.kind || seasons[0]?.type || "TV Сериал", hrs, eps });
        });
      });

      const avgScore = totalTitles ? (scoreSum / totalTitles).toFixed(2) : "0.00";

      document.getElementById("statsRibbon").innerHTML = `
        <div class="stat-card">
          <div>
            <div class="stat-label">Всего просмотрено</div>
            <div class="stat-val">${totalTitles} тайтлов</div>
            <div class="stat-sub">Средний балл: <b style="color:#ffd76a;">★ ${avgScore}</b></div>
          </div>
          <span style="font-size:26px;">📚</span>
        </div>
        <div class="stat-card" style="padding:10px 12px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;">
            <div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 12px;">
              <div class="stat-label">🎞 Серии</div>
              <div style="font-family:'Cinzel',serif;font-size:20px;font-weight:800;color:#ffd76a;margin-top:2px;">${sumEp}</div>
            </div>
            <div style="background:linear-gradient(135deg,rgba(255,60,140,0.16),rgba(255,215,106,0.12));border-radius:10px;padding:8px 12px;">
              <div class="stat-label" style="color:#ffd6e7;">🎬 Фильмы</div>
              <div style="font-family:'Cinzel',serif;font-size:20px;font-weight:800;color:#ff5e7e;margin-top:2px;">${sumMv}</div>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div>
            <div class="stat-label">Всего времени</div>
            <div class="stat-val" style="color:#00f5ff;">${Number(sumHr).toFixed(1)} часов</div>
            <div class="stat-sub">⏳ Дней: <b style="color:#fff;">${(sumHr / 24).toFixed(1)} дн.</b></div>
          </div>
          <span style="font-size:26px;">⏱️</span>
        </div>
      `;

      if (recentList.length > 0) {
        document.getElementById("recentSection").innerHTML = `
          <div class="recent-showcase-box">
            <div class="recent-showcase-head">
              <h2 class="recent-showcase-title"><span>✨ Недавно добавленные и обновлённые тайтлы</span></h2>
            </div>
            <div class="recent-showcase-grid">
              ${recentList.slice(0, 10).map(r => `
                <div class="recent-item-card" onclick="alert('${r.item.title}')">
                  <div class="recent-poster-frame">
                    <img class="card-poster" src="${r.item.poster \vert{}\vert{} 'https://placehold.co/400x600/16122b/ffd76a?text=myTierAnime'}" alt="${r.item.title}" loading="lazy" onerror="this.src='https://placehold.co/400x600/16122b/ffd76a?text=myTierAnime'">
                    <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(6,5,14,0.95) 0%,rgba(6,5,14,0.45) 42%,transparent 75%);pointer-events:none;"></div>
                    <span class="recent-tier-badge">Тир ${r.tier.id}</span>${r.item.score ? `<span class="card-score-badge">★ ${r.item.score}</span>` : ""}
                    <div class="card-info">
                      <div class="card-title">${r.item.title}</div>
                      <div class="card-sub">${r.kind}</div>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      document.getElementById("tiersRoot").innerHTML = data.tiers.map(t => {
        const items = t.items || [];
        const pct = totalTitles > 0 ? Math.round((items.length / totalTitles) * 100) : 0;
        return `
          <section class="tier">
            <aside class="tier-badge">
              <span class="seal-index">ТИР <b>${t.id}</b></span>
              <span class="seal-caption">${t.name}</span>
            </aside>
            <div class="tier-content">
              <header class="tier-header-bar">
                <div class="tier-title-group">
                  <h2>${t.name} <span class="tier-count-pill">${items.length} тайтлов (${pct}%)</span></h2>
                </div>
              </header>
              <div class="tier-grid">
                ${items.map((item, idx) => `
                  <div class="card-unit">
                    <article class="card">
                      <img class="card-poster" src="${item.poster \vert{}\vert{} 'https://placehold.co/400x600/16122b/ffd76a?text=myTierAnime'}" alt="${item.title}" loading="lazy">
                      <span class="rank">${idx + 1}</span>${item.score ? `<span class="card-score-badge">★ ${item.score}</span>` : ""}
                      <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.year || ""}</div>
                      </div>
                    </article>
                    <div class="card-under-meta">
                      <div class="cum-row">
                        <span class="cum-kind">${item.kind || 'TV'}</span>
                      </div>
                      <div class="cum-episodes-line">🎞 ${item.seasons ? item.seasons.length + ' частей' : '12 серий'}</div>
                      <div class="cum-hours-bar"><span>⏱</span><b>${Number(item.totalHours || 4.8).toFixed(1)} ч.</b></div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      }).join("");
    })();
  </script>
</body>
</html>
